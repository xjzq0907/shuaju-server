services:
  duanju-manager:
    build: .
    container_name: duanju-manager
    network_mode: host
    restart: unless-stopped
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - PORT=${PORT:-15006}
      - QUARK_AUTOSAVE_URL=${QUARK_AUTOSAVE_URL:-http://127.0.0.1:15005}
      - ARIA2_RPC=${ARIA2_RPC:-http://127.0.0.1:16800/jsonrpc}
      - BATCH_SIZE=${BATCH_SIZE:-20}
    volumes:
      # 索引 CSV + import_state.json（与 CLI 共用，读写）
      - ${QUARK_LINKS_DIR:?set in .env}:/data/quark-links
      # 本地短剧库（扫描 + 播放）
      - ${LIB_ROOT:?set in .env}:/media-lib
      # SQLite + 运行数据
      - ${DATA_DIR:?set in .env}:/data/duanju
      # quark-auto-save 配置（只读，取 WebUI 账号算 token）
      - ${QUARK_CFG:?set in .env}:/config/quark_config.json:ro
